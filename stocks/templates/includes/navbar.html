{% load static %}
<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
  <div class="container">
    <a href="{% url 'home' %}">
      <img class="navbar-brand" src="{% static 'icon.png' %}" href="{% url 'home' %}" height="80" />
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navmenu">

      <!-- LEFT SIDE -->
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'home' %}">Home</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'teams' %}">Teams</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'invest' %}">Invest</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'leaderboard' %}">Leaderboard</a>
        </li>

        {% if user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'portfolio' username=user.username %}">Portfolio</a>
        </li>
        {% endif %}
      </ul>

      <!-- RIGHT SIDE -->
      <ul class="navbar-nav ms-auto align-items-center">
        {% if user.is_authenticated %}
        <li class="nav-item me-3">
          <span class="nav-link fw-bold text-warning fs-4 border border-warning rounded px-2 py-1">
            {{ user.username }}
          </span>
        </li>
        <li class="nav-item">
          <a href="{% url 'logout' %}" class="nav-link text-light small">Logout</a>
        </li>
        {% else %}
        <li class="nav-item">
          <a href="{% url 'login' %}" class="btn btn-primary">Login</a>
        </li>
        {% endif %}
      </ul>

    </div>
  </div>
</nav>
